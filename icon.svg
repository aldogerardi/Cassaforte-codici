<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF6A"/>
      <stop offset="100%" stop-color="#0A3D1F"/>
    </linearGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00FF6A" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="192" height="192" rx="36" fill="#04070A"/>

  <!-- griglia terminale sottile sullo sfondo -->
  <g opacity="0.08" stroke="#00FF6A" stroke-width="1">
    <line x1="0" y1="48" x2="192" y2="48"/>
    <line x1="0" y1="96" x2="192" y2="96"/>
    <line x1="0" y1="144" x2="192" y2="144"/>
    <line x1="48" y1="0" x2="48" y2="192"/>
    <line x1="96" y1="0" x2="96" y2="192"/>
    <line x1="144" y1="0" x2="144" y2="192"/>
  </g>

  <g filter="url(#neonGlow)">
    <path d="M96 22 L152 42 V92 C152 130 128 156 96 170 C64 156 40 130 40 92 V42 Z"
          fill="url(#shieldGrad)" stroke="#062010" stroke-width="3"/>
    <path d="M96 22 L152 42 V92 C152 130 128 156 96 170 Z" fill="#000" opacity="0.12"/>
  </g>

  <g transform="translate(96,88)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#04070A" stroke-width="9"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#C9FFDA" stroke-width="4"/>
    <rect x="-6" y="14" width="12" height="34" rx="4" fill="#04070A"/>
    <rect x="-6" y="14" width="12" height="34" rx="4" fill="none" stroke="#C9FFDA" stroke-width="3"/>
    <rect x="2" y="34" width="14" height="8" rx="3" fill="#04070A"/>
    <rect x="2" y="34" width="14" height="8" rx="3" fill="none" stroke="#C9FFDA" stroke-width="3"/>
  </g>

  <!-- cursore terminale in basso, tocco finale "nerd" -->
  <rect x="82" y="176" width="28" height="4" fill="#00FF6A" opacity="0.9"/>
</svg>
